[build]
  base = "studio-ui"
  publish = "dist"
  command = "node -e \"const fs=require('fs'); fs.cpSync('../pbiscan/studio/dist', 'dist', {recursive: true});\""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
