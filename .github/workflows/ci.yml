name: CI/CD Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check pbiscan/ tests/ tools/

      - name: Run mypy
        run: |
          mypy pbiscan/

  test:
    name: Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Turns each failing test into a GitHub annotation, readable on the
          # run page without downloading the job log.
          pip install pytest-github-actions-annotate-failures

      # Node runs the cross-engine parity test (Python vs studio-ui clientScanner.ts)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json

      - name: Install Studio UI dependencies
        working-directory: studio-ui
        run: npm ci

      # PBISCAN_REQUIRE_PARITY makes a missing Node toolchain fail instead of skip.
      # Coverage below the fail_under in pyproject.toml fails the run.
      - name: Run Test Suite
        env:
          PBISCAN_REQUIRE_PARITY: "1"
        run: |
          python -m pytest tests/ -v --cov=pbiscan --cov-report=term-missing

  studio-dist:
    name: Studio bundle is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json

      - name: Install Studio UI dependencies
        working-directory: studio-ui
        run: npm ci

      - name: Type-check and build
        working-directory: studio-ui
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p .
          node node_modules/vite/bin/vite.js build

      # pbiscan/studio/dist is committed (it ships in the wheel), so it must be
      # exactly what the current studio-ui sources build to.
      - name: Fail if committed pbiscan/studio/dist differs from a fresh build
        run: |
          if [ -n "$(git status --porcelain -- pbiscan/studio/dist)" ]; then
            echo "::error title=Stale Studio bundle::pbiscan/studio/dist does not match studio-ui sources. Rebuild it (README > Automated Testing) and commit the result."
            git status --porcelain -- pbiscan/studio/dist
            exit 1
          fi

  sarif-scan:
    name: Self-Scan & Upload SARIF
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pbiscan
        run: |
          pip install -e .

      - name: Scan Test PBIP Model
        run: |
          pbiscan scan tests/golden/test_calc_group_variants --out pbiscan.sarif --format sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pbiscan.sarif
          category: pbiscan-quality-audit
