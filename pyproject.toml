[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbiscan"
version = "1.3.0"
description = "Power BI Report Quality & Performance Scanner — static analysis for PBIP projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["power-bi", "pbip", "dax", "static-analysis", "quality"]
dependencies = [
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27.0",
]

[project.scripts]
pbiscan = "pbiscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbiscan*"]

[tool.setuptools.package-data]
pbiscan = [
    "render/templates/*.j2",
    "studio/dist/*",
    "studio/dist/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
