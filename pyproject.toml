[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbiscan"
version = "1.11.1"
description = "Power BI Report Quality & Performance Scanner — static analysis for PBIP projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["power-bi", "pbip", "dax", "static-analysis", "quality"]
dependencies = [
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
mcp = [
    "mcp>=1.2.0,<2.0.0",
]
dev = [
    # Studio and MCP are optional at runtime, but mypy checks and the tests
    # import both servers, so dev needs their dependencies.
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27.0",
    "ruff>=0.16",
    "mypy>=1.9.0",
    "hypothesis>=6.100",
    "mcp>=1.2.0,<2.0.0",
]

[project.scripts]
pbiscan = "pbiscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbiscan*"]

[tool.setuptools.package-data]
pbiscan = [
    "render/templates/*.j2",
    "studio/dist/*",
    "studio/dist/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint]
# Deliberately conservative: pyflakes (F) + core pycodestyle errors (E4/E7/E9) only.
# E402 is excluded because canonical/builder.py and canonical/model.py use deferred
# module-level imports at the bottom of the file to avoid circular imports — that's
# intentional, not an ordering mistake. E501 (line length) isn't enforced anywhere
# else in this codebase, so flagging it here would just be noise on existing lines.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.10"

# Strict checking for the scoring/rules core and modules added since Phase 2.
# New modules should be added to this list; move older ones in as they are
# cleaned up (`mypy --strict --follow-imports=silent <file>` shows the work).
[[tool.mypy.overrides]]
module = [
    "pbiscan.canonical.references",
    "pbiscan.engine.issue",
    "pbiscan.engine.scoring",
    "pbiscan.engine.suppressions",
    "pbiscan.extraction.bim_parser",
    "pbiscan.extraction.pbip_reader",
    "pbiscan.extraction.pbir_parser",
    "pbiscan.extraction.raw",
    "pbiscan.extraction.report_parser",
    "pbiscan.extraction.tmdl_parser",
    "pbiscan.fileio",
    "pbiscan.remediation.integrity",
    "pbiscan.rules.catalog",
    "pbiscan.rules.dax",
    "pbiscan.rules.model",
    "pbiscan.rules.report",
    "pbiscan.service",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[tool.coverage.run]
source = ["pbiscan"]

[tool.coverage.report]
# Applies whenever tests run with --cov (as CI does); currently ~93%.
fail_under = 90
