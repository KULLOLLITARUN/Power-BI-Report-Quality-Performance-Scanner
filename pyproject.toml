[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbiscan"
version = "1.9.0"
description = "Power BI Report Quality & Performance Scanner — static analysis for PBIP projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["power-bi", "pbip", "dax", "static-analysis", "quality"]
dependencies = [
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27.0",
    "ruff>=0.16",
    "mypy>=1.9.0",
]

[project.scripts]
pbiscan = "pbiscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbiscan*"]

[tool.setuptools.package-data]
pbiscan = [
    "render/templates/*.j2",
    "studio/dist/*",
    "studio/dist/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint]
# Deliberately conservative: pyflakes (F) + core pycodestyle errors (E4/E7/E9) only.
# E402 is excluded because canonical/builder.py and canonical/model.py use deferred
# module-level imports at the bottom of the file to avoid circular imports — that's
# intentional, not an ordering mistake. E501 (line length) isn't enforced anywhere
# else in this codebase, so flagging it here would just be noise on existing lines.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]
